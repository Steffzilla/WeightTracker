plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.room)
}

// The JDK that compiles the sources, runs javadoc and runs the unit tests. Declared explicitly
// (Google's recommendation) so it does not silently follow whichever JVM happens to run Gradle.
// Keep in step with gradle/gradle-daemon-jvm.properties.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace 'de.steffzilla.weighttracker'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "de.steffzilla.weighttracker"
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Stable signing so app updates keep the same signature (a signature change forces
    // uninstall and wipes the local database). Applied to BOTH build types so day-to-day
    // "Run" (debug) installs are machine-independent too. The keystore and its
    // credentials live OUTSIDE the repository in the user's ~/.gradle/gradle.properties
    // (WEIGHTTRACKER_RELEASE_* properties); checkouts without them still build, using
    // the default per-machine debug key and an unsigned release APK.
    if (project.hasProperty('WEIGHTTRACKER_RELEASE_STORE_FILE')) {
        signingConfigs {
            release {
                storeFile file(WEIGHTTRACKER_RELEASE_STORE_FILE)
                storePassword WEIGHTTRACKER_RELEASE_STORE_PASSWORD
                keyAlias WEIGHTTRACKER_RELEASE_KEY_ALIAS
                keyPassword WEIGHTTRACKER_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            if (project.hasProperty('WEIGHTTRACKER_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // R8 (shrinking + obfuscation) stays off deliberately. The APK is installed by
            // hand rather than shipped through a store, so the size it would save is worth
            // less than what it risks: Room and View Binding resolve types reflectively, and
            // a missing keep rule shows up only at runtime, only in a release build. Enable
            // it only together with a manual pass over an installed release APK; keep rules
            // belong in keepRules/rules.keep, not inline.
            optimization {
                enable false
            }
            if (project.hasProperty('WEIGHTTRACKER_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Java language level for the app's source and the emitted bytecode. Java 21 is the newest
    // LTS this project can use: the Kotlin compiler bundled with AGP 9 accepts jvmTarget up to 24
    // only, so Java 25 is rejected even though no Kotlin source exists here.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    // Lint runs before every commit (see CLAUDE.md Build Commands). Errors break the build;
    // warnings are read in the report and not promoted, because GradleDependency stays
    // deliberately enabled as the dependency radar — a new upstream release must not turn the
    // build red on its own. No baseline: findings that are judged false positives get a
    // tools:ignore with the reasoning at the place it applies, so the report stays short
    // enough to read every time.
    lint {
        abortOnError = true
        warningsAsErrors = false
    }
}

// Exported schema JSONs (checked into version control) are the baseline against which
// future Room Migrations are written and tested — never remove a version file.
room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.room.runtime
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel
    implementation libs.recyclerview
    implementation libs.preference
    annotationProcessor libs.room.compiler
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.arch.core.testing
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}